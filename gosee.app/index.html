<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>تحميل تطبيق GOSEE</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Readex+Pro:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #fff8e4; --surface: #fffdf6; --ink: #2a1c1f; --muted: #73625f; --accent: #b99396; --accent-dark: #9a737a; --line: #efe0c8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; line-height: 1.7; }
    .card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 32px 24px; text-align: center; }
    .icon { width: 92px; height: 92px; border-radius: 22px; }
    h1 { font-family: "Readex Pro", sans-serif; font-size: 26px; margin: 14px 0 2px; }
    .sub { color: var(--muted); font-size: 15px; margin: 0 0 20px; }
    .meta { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; border-radius: 16px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; font-size: 16px; text-decoration: none; }
    .btn:hover { background: var(--accent-dark); }
    .note { color: var(--muted); font-size: 13px; margin: 18px 0 0; }
    label { display: block; text-align: start; font-weight: 600; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--ink); outline: none; text-align: right; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(185, 147, 150, 0.25); }
    button.btn { border: 0; cursor: pointer; margin-top: 14px; }
    .error { color: #b3261e; font-size: 13.5px; min-height: 22px; margin: 8px 0 0; }
    [hidden] { display: none !important; }
    /* The eye to show / hide the password (2026-11-23). */
    .pw-wrap { position: relative; display: block; }
    .pw-wrap input { padding-left: 46px; }
    .pw-eye { position: absolute; top: 0; bottom: 0; left: 0; width: 46px; display: flex; align-items: center; justify-content: center; background: none; border: 0; padding: 0; color: inherit; opacity: .6; cursor: pointer; }
    .pw-eye:hover, .pw-eye[aria-pressed="true"] { opacity: 1; }
    .pw-eye svg { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="icon.png" alt="">
    <h1>GOSEE</h1>
    <p class="sub">احجز مودل لإعلانك بالساعة، في الطائف</p>
    <form id="gate">
      <label for="pw">كلمة السر</label>
      <span class="pw-wrap"><input id="pw" type="password" autocomplete="current-password" required><button type="button" class="pw-eye" id="pw-eye" aria-label="إظهار كلمة السر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span>
      <button class="btn" type="submit">متابعة</button>
      <p class="error" id="err" role="alert"></p>
    </form>

    <div id="download" hidden>
      <p class="meta" id="ver">نسخة تجريبية · أندرويد</p>
      <a class="btn" id="dl" download="GOSEE.apk">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
        تحميل التطبيق (APK)
      </a>
      <p class="note">بعد التحميل افتح الملف واسمح بالتثبيت من مصادر غير معروفة إذا طُلب منك ذلك.</p>
    </div>
  </main>
  <script>
    // The APK's file name is derived from the password, so the link only exists once the right password is entered.
    const VERIFY_HASH = "3329084b2f69c9c3493a89ae001a5bef584f74277833d08c4146e57dc98c508e";

    async function sha256(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
    }

    async function unlock(pw) {
      if ((await sha256("modely-verify:" + pw)) !== VERIFY_HASH) return false;
      const name = (await sha256(pw)).slice(0, 16);
      document.getElementById("dl").href = "/apk/modely-" + name + ".apk";
      document.getElementById("gate").hidden = true;
      document.getElementById("download").hidden = false;
      fetch("/modely_version.json?t=" + Date.now())
        .then((r) => r.json())
        .then((v) => { document.getElementById("ver").textContent = "نسخة تجريبية · أندرويد · الإصدار " + v.version; })
        .catch(() => {});
      return true;
    }

    document.getElementById("gate").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "";
      if (!(await unlock(document.getElementById("pw").value.trim()))) err.textContent = "كلمة السر غير صحيحة.";
    });
  </script>
  <script>
    (() => {
      const pw = document.getElementById("pw"), eye = document.getElementById("pw-eye");
      eye.addEventListener("click", () => {
        const show = pw.type === "password";
        pw.type = show ? "text" : "password";
        eye.setAttribute("aria-pressed", String(show));
        eye.setAttribute("aria-label", show ? "إخفاء كلمة السر" : "إظهار كلمة السر");
        pw.focus();
      });
    })();
  </script>
</body>
</html>
