name: Deploy web to GitHub Pages

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Employee portal now lives in its own repo (yasserbousfiha-creator/
      # hr-portal) but still deploys under this same domain, at /portal/ —
      # checked out alongside the main site and merged into its build output
      # below, so the two codebases stay independent while the deployed
      # site stays combined.
      - uses: actions/checkout@v4
        with:
          repository: yasserbousfiha-creator/hr-portal
          ref: source
          path: hr-portal

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter build web --release --base-href /

      - name: Build employee portal
        working-directory: hr-portal
        run: |
          flutter pub get
          flutter build web --release --base-href /portal/

      - name: Merge portal build into site output
        run: |
          mkdir -p build/web/portal
          cp -r hr-portal/build/web/. build/web/portal/

      - name: Add SPA fallback for direct-URL routes
        run: cp build/web/index.html build/web/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: main
          cname: smartorganizer.shop
          commit_message: Deploy Flutter Web Build
          # main يُستبدَل بالكامل فكل نشر أصلاً (بلا keep_files) - لا فائدة من
          # تراكم تاريخ Git لملف مُولَّد كاملاً، وكان هذا سبب تضخّم .git لعدة
          # جيجا (كل APK يزيد +50 ميغا بلا حذف القديم). force_orphan يجعل كل
          # نشر يبدأ سجلاً جديداً بلا تاريخ سابق.
          force_orphan: true
          # حادثة حقيقية: .github/workflows/send-broadcast.yml كان موضوعاً
          # مباشرة على main (خارج نطاق هذا النشر تماماً - ملف يدوي لا علاقة
          # له ببناء الويب)، وكل نشر بلا keep_files كان يمسحه بصمت - اختفى
          # فعلياً بعد عدة عمليات نشر متتالية. keep_files يحافظ على أي ملف
          # موجود مسبقاً على main لا يلمسه هذا النشر (مثل .github/ نفسها)،
          # بينما force_orphan أعلاه يبقي يمنع تراكم التاريخ لنفس الفرع.
          #
          # حادثة متكررة أخرى (2026-09-11/12، 3 مرات): apk/*.apk و
          # *_version.json كانت نسخاً ثابتة داخل web/ الخاص بهذا المشروع،
          # تُنسَخ ضمن ناتج البناء وتُنشَر فوق smartorganizer.shop بالكامل -
          # فتتجمَّد على آخر إصدار وُجِد وقت مزامنتها يدوياً، وتُعيد الموقع
          # الحي إصداراً قديماً لتطبيقات منظّمك الذكي/مدرستي/تاكتيكو عند كل
          # نشر لاحق من هنا. محاولة أولى بسحب أحدث نسخة من الموقع الحي وقت
          # البناء فشلت أيضاً (سباق توقيت: لو كان الموقع نفسه معطوباً مؤقتاً
          # بسبب نشر سابق غير مُصلَح، تُنسَخ العطوبة للأمام). الحل الجذري:
          # حُذفت هذه الملفات نهائياً من web/ هذا المشروع (git rm) - فلم تعد
          # جزءاً من ناتج البناء إطلاقاً، و keep_files أعلاه يحافظ عليها كما
          # هي على main دون أي مساس، بغضّ النظر عن توقيت أي نشر من هنا.
          keep_files: true
