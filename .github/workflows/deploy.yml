name: Deploy web to GitHub Pages

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Employee portal now lives in its own repo (yasserbousfiha-creator/
      # hr-portal) but still deploys under this same domain, at /portal/ —
      # checked out alongside the main site and merged into its build output
      # below, so the two codebases stay independent while the deployed
      # site stays combined.
      - uses: actions/checkout@v4
        with:
          repository: yasserbousfiha-creator/hr-portal
          ref: source
          path: hr-portal

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter build web --release --base-href /

      - name: Build employee portal
        working-directory: hr-portal
        run: |
          flutter pub get
          flutter build web --release --base-href /portal/

      - name: Merge portal build into site output
        run: |
          mkdir -p build/web/portal
          cp -r hr-portal/build/web/. build/web/portal/

      - name: Add SPA fallback for direct-URL routes
        run: cp build/web/index.html build/web/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: main
          cname: smartorganizer.shop
          commit_message: Deploy Flutter Web Build
          # حادثة حرجة (2026-09-12): force_orphan:true مع keep_files:true
          # معاً لا يعملان كما تُوثِّق التعليقات القديمة أدناه - تحقّقنا فعلياً
          # (git ls-tree على الكوميت الناتج) أن apk/ و*_version.json اختفتا
          # بالكامل من الشجرة الجديدة رغم keep_files:true وحذفهما من ناتج
          # بناء هذا المشروع (git rm سابقاً) - أي أن force_orphan يبني شجرة
          # جديدة بالكامل من publish_dir فقط، متجاهلاً keep_files تماماً في
          # هذا الوضع. عُطِّل force_orphan نهائياً لهذا السبب: keep_files
          # بمفرده (بلا force_orphan) هو السلوك المُوثَّق والمُختبَر فعلياً في
          # هذه الأداة (نجح تاريخياً مع send-broadcast.yml، الحادثة الموصوفة
          # أدناه) - يدمج الملفات الجديدة مع الفرع الحالي عبر checkout حقيقي
          # بدل بناء شجرة orphan اصطناعية. الكلفة: تاريخ git لهذا المشروع
          # (mywebsite) فقط سينمو تدريجياً مع كل نشر - لا يمسّ أبداً محتوى أو
          # تاريخ smart-organizer-web نفسه، وناتج بناء Flutter Web (JS/HTML)
          # أصغر وأكثر قابلية للضغط التفاضلي من ملفات APK الثنائية، فالنمو
          # أخف بكثير من مشكلة الـ APK الأصلية. لا تُعِد تفعيل force_orphan
          # هنا أبداً طالما هذا النشر يشارك main مع مشروع آخر يحتاج الحفاظ
          # على مساراته.
          #
          # حادثة حقيقية أقدم: .github/workflows/send-broadcast.yml كان
          # موضوعاً مباشرة على main (خارج نطاق هذا النشر تماماً - ملف يدوي لا
          # علاقة له ببناء الويب)، وكل نشر بلا keep_files كان يمسحه بصمت -
          # اختفى فعلياً بعد عدة عمليات نشر متتالية. keep_files يحافظ على أي
          # ملف موجود مسبقاً على main لا يلمسه هذا النشر (مثل .github/ نفسها).
          #
          # حادثة متكررة أخرى (2026-09-11/12، 3 مرات قبل هذا الإصلاح):
          # apk/*.apk و*_version.json كانت نسخاً ثابتة داخل web/ الخاص بهذا
          # المشروع، تُنسَخ ضمن ناتج البناء وتُنشَر فوق smartorganizer.shop
          # بالكامل - فتتجمَّد على آخر إصدار وُجِد وقت مزامنتها يدوياً، وتُعيد
          # الموقع الحي إصداراً قديماً لتطبيقات منظّمك الذكي/مدرستي/تاكتيكو
          # عند كل نشر لاحق من هنا. حُذفت هذه الملفات نهائياً من web/ هذا
          # المشروع (git rm) فلم تعد جزءاً من ناتج البناء إطلاقاً - هذا وحده
          # كان يكفي مع keep_files العامل فعلياً (بلا force_orphan) أعلاه.
          keep_files: true
