# طلب صريح: عُطِّل التشغيل التلقائي (on: push) لأن remote الأصلي لهذا
# المشروع (origin) وسطر cname أدناه كلاهما يشير بالخطأ لمستودع/نطاق
# smart-organizer-web (مشروع منظّمك الذكي، لا علاقة له بهذا المشروع) - كل
# دفعة (push) لفرع source هنا كانت تمحو موقع smartorganizer.shop الحقيقي
# بالكامل (نُشر لديهم بأثر رجعي مرتين، 2026-09-11). الإصلاح الحقيقي (origin
# repo مستقل + نطاق/cname خاص بهذا المشروع) لم يُنجَز بعد - يحتاج مستودع
# GitHub جديد مخصَّص (gh CLI غير مثبَّت على هذا الجهاز، فلم يُتَح إنشاؤه
# آلياً) قبل إعادة تفعيل هذا الزناد. حتى ذلك، لا يعمل هذا النشر إلا يدوياً
# (workflow_dispatch من واجهة GitHub) - لا مخاطرة عرضية بعد الآن.
name: Deploy web to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter build web --release --base-href /

      - name: Add SPA fallback for direct-URL routes
        run: cp build/web/index.html build/web/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: main
          cname: smartorganizer.shop
          commit_message: Deploy Flutter Web Build
          # main يُستبدَل بالكامل فكل نشر أصلاً (بلا keep_files) - لا فائدة من
          # تراكم تاريخ Git لملف مُولَّد كاملاً، وكان هذا سبب تضخّم .git لعدة
          # جيجا (كل APK يزيد +50 ميغا بلا حذف القديم). force_orphan يجعل كل
          # نشر يبدأ سجلاً جديداً بلا تاريخ سابق.
          force_orphan: true
          # حادثة حقيقية: .github/workflows/send-broadcast.yml كان موضوعاً
          # مباشرة على main (خارج نطاق هذا النشر تماماً - ملف يدوي لا علاقة
          # له ببناء الويب)، وكل نشر بلا keep_files كان يمسحه بصمت - اختفى
          # فعلياً بعد عدة عمليات نشر متتالية. keep_files يحافظ على أي ملف
          # موجود مسبقاً على main لا يلمسه هذا النشر (مثل .github/ نفسها)،
          # بينما force_orphan أعلاه يبقي يمنع تراكم التاريخ لنفس الفرع.
          keep_files: true
