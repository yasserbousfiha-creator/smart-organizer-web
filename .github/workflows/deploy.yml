name: Deploy web to GitHub Pages

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter build web --release --base-href /

      - name: Add SPA fallback for direct-URL routes
        run: cp build/web/index.html build/web/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: main
          cname: smartorganizer.shop
          commit_message: Deploy Flutter Web Build
          # main يُستبدَل بالكامل فكل نشر أصلاً (بلا keep_files) - لا فائدة من
          # تراكم تاريخ Git لملف مُولَّد كاملاً، وكان هذا سبب تضخّم .git لعدة
          # جيجا (كل APK يزيد +50 ميغا بلا حذف القديم). force_orphan يجعل كل
          # نشر يبدأ سجلاً جديداً بلا تاريخ سابق.
          force_orphan: true
