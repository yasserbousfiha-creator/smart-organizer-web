# تصحيح 2026-09-11: هذا المشروع كان يستخدم بالخطأ remote ونطاق (cname)
# مشروع آخر منفصل تماماً (smart-organizer-web / smartorganizer.shop)، فكانت
# كل دفعة هنا تمحو موقع ذلك المشروع. المستودع الآن مستقل بالكامل
# (yasserbousfiha-creator/hr-portal) وينشر لرابط GitHub Pages الافتراضي
# الخاص به فقط (لا cname مخصص حتى يُضاف نطاق خاص بالبوابة لاحقاً).
name: Deploy web to GitHub Pages

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter build web --release --base-href /hr-portal/

      - name: Add SPA fallback for direct-URL routes
        run: cp build/web/index.html build/web/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: main
          commit_message: Deploy Flutter Web Build
          # main يُستبدَل بالكامل فكل نشر أصلاً (بلا keep_files) - لا فائدة من
          # تراكم تاريخ Git لملف مُولَّد كاملاً، وكان هذا سبب تضخّم .git لعدة
          # جيجا (كل APK يزيد +50 ميغا بلا حذف القديم). force_orphan يجعل كل
          # نشر يبدأ سجلاً جديداً بلا تاريخ سابق.
          force_orphan: true
          # حادثة حقيقية: .github/workflows/send-broadcast.yml كان موضوعاً
          # مباشرة على main (خارج نطاق هذا النشر تماماً - ملف يدوي لا علاقة
          # له ببناء الويب)، وكل نشر بلا keep_files كان يمسحه بصمت - اختفى
          # فعلياً بعد عدة عمليات نشر متتالية. keep_files يحافظ على أي ملف
          # موجود مسبقاً على main لا يلمسه هذا النشر (مثل .github/ نفسها)،
          # بينما force_orphan أعلاه يبقي يمنع تراكم التاريخ لنفس الفرع.
          keep_files: true
