name: Deploy web to GitHub Pages

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Employee portal now lives in its own repo (yasserbousfiha-creator/
      # hr-portal) but still deploys under this same domain, at /portal/ —
      # checked out alongside the main site and merged into its build output
      # below, so the two codebases stay independent while the deployed
      # site stays combined.
      - uses: actions/checkout@v4
        with:
          repository: yasserbousfiha-creator/hr-portal
          ref: source
          path: hr-portal

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter build web --release --base-href /

      # حادثة متكررة (2026-09-11/12، 3 مرات): apk/*.apk و*_version.json هنا
      # نسخ ثابتة داخل web/ الخاص بهذا المشروع، تُنسَخ حرفياً ضمن ناتج البناء
      # وتُنشَر فوق smartorganizer.shop بالكامل (force_orphan يستبدل main
      # كله). كانت تتجمَّد على آخر إصدار وُجِد وقت مزامنتها يدوياً هنا، فكل
      # نشر لاحق من هذا المشروع كان يُعيد الموقع الحي إصداراً قديماً لتطبيقات
      # منظّمك الذكي/مدرستي/تاكتيكو - بغضّ النظر عمّا نُشر هناك لاحقاً. الحل
      # البنيوي: سحب أحدث نسخة مباشرة من الموقع الحي نفسه عند كل بناء، فلا
      # يمكن أن تتجمَّد بعد الآن مهما تأخّر التزامن اليدوي.
      - name: Sync latest published app assets (avoid deploying stale bundled copies)
        run: |
          curl -fL -o build/web/apk/smart-organizer.apk https://smartorganizer.shop/apk/smart-organizer.apk
          curl -fL -o build/web/apk/my-school.apk https://smartorganizer.shop/apk/my-school.apk
          curl -fL -o build/web/apk/tactico.apk https://smartorganizer.shop/apk/tactico.apk
          curl -fL -o build/web/app_version.json https://smartorganizer.shop/app_version.json
          curl -fL -o build/web/my_school_version.json https://smartorganizer.shop/my_school_version.json
          curl -fL -o build/web/tactico_version.json https://smartorganizer.shop/tactico_version.json
          mkdir -p build/web/audio
          curl -fL -o build/web/audio/al-kahf-qazabri.mp3 https://smartorganizer.shop/audio/al-kahf-qazabri.mp3

      - name: Build employee portal
        working-directory: hr-portal
        run: |
          flutter pub get
          flutter build web --release --base-href /portal/

      - name: Merge portal build into site output
        run: |
          mkdir -p build/web/portal
          cp -r hr-portal/build/web/. build/web/portal/

      - name: Add SPA fallback for direct-URL routes
        run: cp build/web/index.html build/web/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: main
          cname: smartorganizer.shop
          commit_message: Deploy Flutter Web Build
          # main يُستبدَل بالكامل فكل نشر أصلاً (بلا keep_files) - لا فائدة من
          # تراكم تاريخ Git لملف مُولَّد كاملاً، وكان هذا سبب تضخّم .git لعدة
          # جيجا (كل APK يزيد +50 ميغا بلا حذف القديم). force_orphan يجعل كل
          # نشر يبدأ سجلاً جديداً بلا تاريخ سابق.
          force_orphan: true
          # حادثة حقيقية: .github/workflows/send-broadcast.yml كان موضوعاً
          # مباشرة على main (خارج نطاق هذا النشر تماماً - ملف يدوي لا علاقة
          # له ببناء الويب)، وكل نشر بلا keep_files كان يمسحه بصمت - اختفى
          # فعلياً بعد عدة عمليات نشر متتالية. keep_files يحافظ على أي ملف
          # موجود مسبقاً على main لا يلمسه هذا النشر (مثل .github/ نفسها)،
          # بينما force_orphan أعلاه يبقي يمنع تراكم التاريخ لنفس الفرع.
          keep_files: true
