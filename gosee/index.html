<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#5e3f48">
  <title>GOSEE · لوحة الإدارة</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css?v=2">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <div class="login-logo"><img src="logo.png" alt="GOSEE"></div>
      <h1>لوحة الإدارة</h1>
      <label for="email">البريد</label>
      <input id="email" type="email" autocomplete="username" required dir="ltr">
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" autocomplete="current-password" required dir="ltr">
      <p id="login-error" class="error" role="alert"></p>
      <button class="btn primary wide" type="submit">دخول</button>
    </form>
  </div>

  <div id="shell" class="shell" hidden>
    <nav class="side" aria-label="القائمة">
      <div class="brand"><img src="logo.png" alt="GOSEE"><span>لوحة الإدارة</span></div>
      <div class="menu" id="menu"></div>
      <div class="me">
        <img src="icon.png" alt="">
        <div><strong id="me-name">المدير</strong><button type="button" id="logout" class="link-btn">خروج</button></div>
      </div>
    </nav>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div id="dialog" class="dialog" hidden>
    <div class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <div class="dialog-actions" id="dialog-actions"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js?v=1"></script>
  <script src="admin.js?v=2"></script>
</body>
</html>
