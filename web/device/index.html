<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حالة الصيانة</title>
<style>
  :root {
    --indigo: #4f46e5;
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --green: #22c55e;
    --amber: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 14px;
  }
  .wrap { width: 100%; max-width: 480px; }
  .logo-row { display: flex; justify-content: center; margin-bottom: 18px; }
  .logo-row img { height: 56px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .device-name { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .device-sub { color: var(--muted); font-size: 13px; margin: 0; }
  .section-title { font-size: 14px; font-weight: 700; margin: 22px 0 10px; color: var(--muted); }
  .entry {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .entry-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .entry-date { font-weight: 600; font-size: 14px; }
  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .badge.regular { background: rgba(34,197,94,.15); color: var(--green); }
  .badge.emergency { background: rgba(245,158,11,.15); color: var(--amber); }
  .entry-next { color: var(--muted); font-size: 12px; margin: 2px 0; }
  .entry-notes { font-size: 13px; margin-top: 4px; }
  .entry-tech { color: var(--muted); font-size: 11px; margin-top: 6px; }
  .empty, .error, .loading { text-align: center; color: var(--muted); padding: 40px 10px; }
  .error { color: #f87171; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo-row"><img src="logo.png" alt="logo"></div>
    <div id="content" class="loading">جارٍ التحميل...</div>
  </div>
  <script>
    const FN_URL = 'https://zzbjjbottjcpqbzydnyx.supabase.co/functions/v1/ppm-public-status';
    const params = new URLSearchParams(window.location.search);
    const token = params.get('t') || params.get('token');
    const content = document.getElementById('content');

    function fmt(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function load() {
      if (!token) {
        content.className = 'error';
        content.textContent = 'رابط غير صالح.';
        return;
      }
      try {
        const res = await fetch(FN_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
        });
        if (!res.ok) {
          content.className = 'error';
          content.textContent = res.status === 404 ? 'لم يتم العثور على هذا الجهاز.' : 'تعذّر تحميل البيانات.';
          return;
        }
        const data = await res.json();
        render(data);
      } catch (e) {
        content.className = 'error';
        content.textContent = 'تعذّر الاتصال بالخادم.';
      }
    }

    function render(data) {
      const d = data.device;
      const history = data.history || [];
      let html = `
        <div class="card">
          <p class="device-name">${escapeHtml(d.name)}</p>
          <p class="device-sub">
            ${d.device_number ? 'الرقم: ' + escapeHtml(d.device_number) : ''}
            ${d.model_version ? ' &nbsp;•&nbsp; الموديل: ' + escapeHtml(d.model_version) : ''}
          </p>
        </div>
        <div class="section-title">سجل الصيانة (${history.length})</div>
      `;
      if (history.length === 0) {
        html += '<div class="empty">لا يوجد سجل صيانة بعد</div>';
      } else {
        for (const h of history) {
          const isEmergency = h.type === 'طارئة';
          html += `
            <div class="entry">
              <div class="entry-top">
                <span class="entry-date">${fmt(h.performed_at)}</span>
                <span class="badge ${isEmergency ? 'emergency' : 'regular'}">${isEmergency ? 'طارئة' : 'دورية'}</span>
              </div>
              <p class="entry-next">الصيانة القادمة: ${fmt(h.next_due_date)}</p>
              ${h.notes ? `<p class="entry-notes">${escapeHtml(h.notes)}</p>` : ''}
              ${h.technician ? `<p class="entry-tech">بواسطة: ${escapeHtml(h.technician)}</p>` : ''}
            </div>
          `;
        }
      }
      content.className = '';
      content.innerHTML = html;
    }

    load();
  </script>
</body>
</html>
