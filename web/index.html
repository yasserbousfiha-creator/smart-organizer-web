<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- بلا هاد الوسم، متصفحات داخل التطبيقات (Instagram/Facebook in-app
       browser) كترندر الصفحة بعرض سطح مكتب افتراضي (~980px) وكتصغّرها،
       وهادشي كيسبب مشاكل عرض/تفاعل غريبة أو صفحة ما كتبانش. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Smart Organizer - نظّم حياتك ومهامك بذكاء وسهولة">
  <meta name="theme-color" content="#061A22">

  <meta property="og:title" content="Smart Organizer">
  <meta property="og:description" content="Smart Organizer - نظّم حياتك ومهامك بذكاء وسهولة">
  <meta property="og:image" content="https://smartorganizer.shop/icons/Icon-512.png">
  <meta property="og:url" content="https://smartorganizer.shop/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ar_AR">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Smart Organizer">
  <meta name="twitter:description" content="Smart Organizer - نظّم حياتك ومهامك بذكاء وسهولة">
  <meta name="twitter:image" content="https://smartorganizer.shop/icons/Icon-512.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Smart Organizer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Smart Organizer</title>
  <link rel="manifest" href="manifest.json">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>

</head>
<body>
  <script src="bundle.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
