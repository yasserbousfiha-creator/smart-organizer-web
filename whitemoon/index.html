<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fbf7ee">
  <title>تحميل تطبيق وايت مون</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fbf7ee;
      --surface: #ffffff;
      --surface2: #f3ecda;
      --ink: #211c14;
      --ink-soft: #6b6250;
      --gold: #9c7a2e;
      --gold-bright: #c9a24b;
      --line: rgba(165, 121, 42, 0.25);
      --line-strong: rgba(165, 121, 42, 0.4);
      --night: #0e0b07;
      --error: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Tajawal", system-ui, sans-serif;
      line-height: 1.65;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(201, 162, 75, 0.12);
    }
    .icon { width: 88px; height: 88px; border-radius: 20px; }
    h1 { font-family: "Cairo", sans-serif; font-size: 24px; margin: 14px 0 4px; }
    .sub { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 24px; }
    .meta { color: var(--ink-soft); font-size: 13px; margin: 0 0 20px; }
    label { display: block; text-align: start; font-weight: 700; font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; }
    input {
      width: 100%;
      font: inherit;
      font-size: 16px;
      padding: 12px 14px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: var(--bg);
      color: var(--ink);
      outline: none;
    }
    input:focus { border-color: var(--gold-bright); box-shadow: 0 0 0 3px rgba(201, 162, 75, 0.2); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 14px;
      padding: 13px 22px;
      border: none;
      border-radius: 999px;
      background: var(--gold-bright);
      color: var(--night);
      font: inherit;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .error { color: var(--error); font-size: 13.5px; min-height: 22px; margin: 8px 0 0; }
    .note { color: var(--ink-soft); font-size: 12.5px; margin: 18px 0 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="icon.png" alt="">
    <h1>وايت مون</h1>
    <p class="sub">مجمع طبي متخصص — تطبيق أندرويد</p>

    <form id="gate">
      <label for="pw">كلمة السر</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">متابعة</button>
      <p class="error" id="err" role="alert"></p>
    </form>

    <div id="download" hidden>
      <p class="meta" id="ver"></p>
      <a class="btn" id="dl" download>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
        تحميل التطبيق (APK)
      </a>
      <p class="note">بعد التحميل افتح الملف واسمح بالتثبيت من مصادر غير معروفة إذا طُلب منك ذلك.</p>
    </div>
  </main>

  <script>
    // The APK's file name is derived from the password, so the link only exists once the right password is entered.
    const VERIFY_HASH = "5c41cbc4616c2501438685883bbb3b58fd71f16eee343814d6b14d5ef7a10f8d";

    async function sha256(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
    }

    async function unlock(pw) {
      if ((await sha256("whitemoon-verify:" + pw)) !== VERIFY_HASH) return false;
      const name = (await sha256(pw)).slice(0, 16);
      document.getElementById("dl").href = "/apk/whitemoon-" + name + ".apk";
      document.getElementById("gate").hidden = true;
      document.getElementById("download").hidden = false;
      fetch("/whitemoon_version.json?t=" + Date.now())
        .then((r) => r.json())
        .then((v) => { document.getElementById("ver").textContent = "الإصدار " + v.version; })
        .catch(() => {});
      return true;
    }

    document.getElementById("gate").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "";
      if (!(await unlock(document.getElementById("pw").value))) err.textContent = "كلمة السر غير صحيحة.";
    });
  </script>
</body>
</html>
